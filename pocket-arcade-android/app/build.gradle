plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pierreaccolite.pocketarcade'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pierreaccolite.pocketarcade'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
}
