<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CamLapse</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>CamLapse</h1>
            <p>Local camera capture and timelapse portal</p>
        </header>

        <section class="panel">
            <label for="cameraSelect">Camera</label>
            <div class="row">
                <select id="cameraSelect"></select>
                <button id="refreshBtn">Refresh</button>
            </div>
        </section>

        <section class="preview panel">
            <img id="preview" src="/video_feed" alt="Live camera preview">
        </section>

        <section class="controls">
            <div class="panel">
                <h2>Photo</h2>
                <button class="primary" id="photoBtn">Take Photo</button>
                <p id="photoStatus" class="status"></p>
            </div>

            <div class="panel">
                <h2>Video</h2>
                <button id="videoStartBtn">Start Recording</button>
                <button class="danger" id="videoStopBtn" disabled>Stop Recording</button>
                <p id="videoStatus" class="status">Video recording coming next.</p>
            </div>

            <div class="panel">
                <h2>Timelapse</h2>
                <label for="interval">Interval</label>
                <select id="interval">
                    <option value="10">10 seconds</option>
                    <option value="30">30 seconds</option>
                    <option value="60">1 minute</option>
                    <option value="300">5 minutes</option>
                    <option value="600">10 minutes</option>
                    <option value="1800">30 minutes</option>
                    <option value="3600">1 hour</option>
                </select>

                <label for="duration">Duration</label>
                <select id="duration">
                    <option value="0">Manual stop</option>
                    <option value="3600">1 hour</option>
                    <option value="7200">2 hours</option>
                    <option value="21600">6 hours</option>
                    <option value="43200">12 hours</option>
                    <option value="86400">24 hours</option>
                </select>

                <div class="row">
                    <button id="timelapseStartBtn">Start Timelapse</button>
                    <button class="danger" id="timelapseStopBtn" disabled>Stop</button>
                </div>

                <p id="timelapseStatus" class="status">Ready.</p>
            </div>
        </section>
    </main>

    <script>
        async function loadCameras() {
            const response = await fetch("/api/cameras");
            const data = await response.json();
            const select = document.getElementById("cameraSelect");

            select.innerHTML = "";

            data.cameras.forEach(camera => {
                const option = document.createElement("option");
                option.value = camera.index;
                option.textContent =
                    camera.name + " (" + camera.resolution + ")";
                option.selected = camera.index === data.selected;
                select.appendChild(option);
            });

            if (!data.cameras.length) {
                const option = document.createElement("option");
                option.textContent = "No cameras detected";
                option.disabled = true;
                select.appendChild(option);
            }
        }

        document.getElementById("refreshBtn").addEventListener("click", loadCameras);

        document.getElementById("cameraSelect").addEventListener("change", async event => {
            await fetch("/api/camera/" + event.target.value, { method: "POST" });
            document.getElementById("preview").src =
                "/video_feed?t=" + Date.now();
        });

        document.getElementById("photoBtn").addEventListener("click", async () => {
            const status = document.getElementById("photoStatus");
            status.textContent = "Capturing...";

            const response = await fetch("/api/photo", { method: "POST" });
            const data = await response.json();

            status.textContent = data.ok
                ? "Saved: " + data.filename
                : "Error: " + data.error;
        });

        loadCameras();
    </script>
</body>
</html>
