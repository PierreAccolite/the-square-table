<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CamLapse</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>CamLapse</h1>
            <p>Local camera capture and timelapse portal</p>
        </header>

        <section class="panel">
            <label for="cameraSelect">Camera</label>
            <div class="row">
                <select id="cameraSelect"></select>
                <button id="refreshBtn">Refresh</button>
            </div>
        </section>

        <section class="preview panel">
            <img id="preview" src="/video_feed" alt="Live camera preview">
        </section>

        <section class="controls">
            <div class="panel">
                <h2>Photo</h2>
                <button class="primary" id="photoBtn">Take Photo</button>
                <p id="photoStatus" class="status"></p>
            </div>

            <div class="panel">
                <h2>Video</h2>
                <button class="primary" id="videoStartBtn">Start Recording</button>
                <button class="danger" id="videoStopBtn" disabled>Stop Recording</button>
                <p id="videoStatus" class="status">Ready.</p>
            </div>

            <div class="panel">
                <h2>Timelapse</h2>

                <label for="interval">Interval</label>
                <select id="interval">
                    <option value="10">10 seconds</option>
                    <option value="30">30 seconds</option>
                    <option value="60">1 minute</option>
                    <option value="300">5 minutes</option>
                    <option value="600">10 minutes</option>
                    <option value="1800">30 minutes</option>
                    <option value="3600">1 hour</option>
                </select>

                <label for="duration">Duration</label>
                <select id="duration">
                    <option value="0">Manual stop</option>
                    <option value="3600">1 hour</option>
                    <option value="7200">2 hours</option>
                    <option value="21600">6 hours</option>
                    <option value="43200">12 hours</option>
                    <option value="86400">24 hours</option>
                </select>

                <label for="startAt">Scheduled start (optional)</label>
                <input id="startAt" type="datetime-local">

                <div class="row">
                    <button class="primary" id="timelapseStartBtn">Start Timelapse</button>
                    <button class="danger" id="timelapseStopBtn" disabled>Stop</button>
                </div>

                <p id="timelapseStatus" class="status">Ready.</p>
            </div>
        </section>
    </main>

    <script>
        const $ = id => document.getElementById(id);

        async function loadCameras() {
            try {
                const response = await fetch("/api/cameras");
                const data = await response.json();
                const select = $("cameraSelect");

                select.innerHTML = "";

                data.cameras.forEach(camera => {
                    const option = document.createElement("option");
                    option.value = camera.index;
                    option.textContent =
                        camera.name + " (" + camera.resolution + ")";
                    option.selected = camera.index === data.selected;
                    select.appendChild(option);
                });

                if (!data.cameras.length) {
                    const option = document.createElement("option");
                    option.textContent = "No cameras detected";
                    option.disabled = true;
                    select.appendChild(option);
                }
            } catch (error) {
                $("cameraSelect").innerHTML =
                    "<option>Camera scan failed</option>";
            }
        }

        async function refreshStatus() {
            try {
                const response = await fetch("/api/status");
                const data = await response.json();

                if (data.video_recording) {
                    $("videoStatus").textContent =
                        "Recording: " + data.video_filename;
                }

                if (data.timelapse_running) {
                    $("timelapseStatus").textContent =
                        "Running — frames captured: " + data.timelapse_frames;
                } else if (data.timelapse_filename) {
                    $("timelapseStatus").textContent =
                        "Finished: " + data.timelapse_filename;
                }

                $("videoStartBtn").disabled =
                    data.video_recording || data.timelapse_running;
                $("videoStopBtn").disabled = !data.video_recording;

                $("timelapseStartBtn").disabled =
                    data.video_recording || data.timelapse_running;
                $("timelapseStopBtn").disabled = !data.timelapse_running;

                $("photoBtn").disabled =
                    data.video_recording || data.timelapse_running;

                if (!data.ffmpeg_available && data.timelapse_running === false) {
                    $("timelapseStatus").title =
                        "Portable FFmpeg is not installed. Frames will still be captured, but MP4 stitching will be skipped.";
                }
            } catch (error) {
                // Server may be starting or stopping.
            }
        }

        $("refreshBtn").addEventListener("click", loadCameras);

        $("cameraSelect").addEventListener("change", async event => {
            const response = await fetch(
                "/api/camera/" + event.target.value,
                { method: "POST" }
            );

            const data = await response.json();

            if (!data.ok) {
                alert(data.error);
                return;
            }

            $("preview").src = "/video_feed?t=" + Date.now();
        });

        $("photoBtn").addEventListener("click", async () => {
            $("photoStatus").textContent = "Capturing...";

            const response = await fetch("/api/photo", {
                method: "POST"
            });
            const data = await response.json();

            $("photoStatus").textContent = data.ok
                ? "Saved: " + data.filename
                : "Error: " + data.error;
        });

        $("videoStartBtn").addEventListener("click", async () => {
            const response = await fetch("/api/video/start", {
                method: "POST"
            });
            const data = await response.json();

            $("videoStatus").textContent = data.ok
                ? "Recording: " + data.filename
                : "Error: " + data.error;

            refreshStatus();
        });

        $("videoStopBtn").addEventListener("click", async () => {
            $("videoStatus").textContent = "Stopping...";

            const response = await fetch("/api/video/stop", {
                method: "POST"
            });
            const data = await response.json();

            $("videoStatus").textContent = data.ok
                ? "Saved: " + data.filename
                : "Error: " + data.error;

            refreshStatus();
        });

        $("timelapseStartBtn").addEventListener("click", async () => {
            const payload = {
                interval: Number($("interval").value),
                duration: Number($("duration").value),
                start_at: $("startAt").value
            };

            const response = await fetch("/api/timelapse/start", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            $("timelapseStatus").textContent = data.ok
                ? data.scheduled
                    ? "Scheduled for " +
                      new Date(data.scheduled).toLocaleString()
                    : "Starting..."
                : "Error: " + data.error;

            refreshStatus();
        });

        $("timelapseStopBtn").addEventListener("click", async () => {
            const response = await fetch("/api/timelapse/stop", {
                method: "POST"
            });
            const data = await response.json();

            $("timelapseStatus").textContent = data.ok
                ? "Stopping and building MP4..."
                : "Error: " + data.error;

            refreshStatus();
        });

        loadCameras();
        refreshStatus();
        setInterval(refreshStatus, 1000);
    </script>
</body>
</html>
