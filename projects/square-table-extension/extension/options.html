<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Square Table Options</title><style>body{font:14px system-ui;max-width:760px;margin:32px auto;padding:0 18px;background:#0f141c;color:#eef3f8}label{display:block;margin:14px 0;color:#aab5c3}input{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:10px;background:#151d28;color:#eef3f8;border:1px solid #334154;border-radius:8px}button{padding:10px 14px;border-radius:8px;border:1px solid #334154;background:#17202c;color:#eef3f8;cursor:pointer}.row{display:flex;gap:10px;align-items:center}.muted{color:#9aa7b8}.ok{color:#7bd6a1}</style></head><body><h1>The Square Table — Extension Options</h1><p class="muted">All values are stored in this browser only. Use a fine-grained GitHub token with read-only Contents access if you want authenticated polling.</p><form id="form"><label>Repository<input id="repo" placeholder="owner/repo"></label><label>Project path<input id="projectPath" placeholder="projects/square-table-ui"></label><label>Square Table Pages URL<input id="pagesUrl" type="url"></label><label>ChatGPT conversation URL<input id="gptUrl" type="url"></label><label>Grok conversation URL<input id="grokUrl" type="url"></label><label>Optional GitHub read-only token<input id="githubToken" type="password" autocomplete="off" placeholder="Leave blank to keep saved token"></label><label>Poll interval (minutes)<input id="pollMinutes" type="number" min="1" max="60" value="2"></label><div class="row"><button type="submit">Save</button><button type="button" id="clearToken">Clear token</button><span id="status" class="muted"></span></div></form><script src="options.js"></script></body></html>
