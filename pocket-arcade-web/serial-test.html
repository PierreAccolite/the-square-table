<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pocket Arcade Serial Baud Test</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .test-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
    .test-row label{display:flex;flex-direction:column;gap:5px;font-weight:600}
    select,button{font:inherit;padding:9px 12px}
    #output{height:420px;overflow:auto;background:#050b0d;color:#d7f6f4;border:1px solid #17434a;border-radius:8px;padding:12px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:13px}
    .hint{opacity:.8;font-size:.9rem}
  </style>
</head>
<body>
  <main class="container">
    <h1>Pocket Arcade — Serial Baud Test</h1>
    <p class="hint">Standalone diagnostic. This does not modify or replace the normal arcade web test.</p>

    <section class="panel">
      <div class="test-row">
        <label>Baud rate
          <select id="baud">
            <option value="74880" selected>74880 — Pocket Arcade application</option>
            <option value="115200">115200 — legacy/test rate</option>
            <option value="9600">9600</option>
            <option value="57600">57600</option>
            <option value="230400">230400</option>
          </select>
        </label>
        <button id="connect">CONNECT</button>
        <button id="disconnect" disabled>DISCONNECT</button>
        <button id="clear">CLEAR</button>
        <button id="ping" disabled>PING</button>
      </div>
      <p id="status">Disconnected</p>
    </section>

    <section class="panel">
      <h2>Raw serial output</h2>
      <pre id="output"></pre>
    </section>
  </main>

<script>
(() => {
  const baud = document.getElementById('baud');
  const connectBtn = document.getElementById('connect');
  const disconnectBtn = document.getElementById('disconnect');
  const clearBtn = document.getElementById('clear');
  const pingBtn = document.getElementById('ping');
  const status = document.getElementById('status');
  const output = document.getElementById('output');

  let port = null;
  let reader = null;
  let keepReading = false;
  let writer = null;

  function log(text) {
    output.textContent += text + "\n";
    output.scrollTop = output.scrollHeight;
  }

  function setStatus(text) {
    status.textContent = text;
  }

  async function readLoop() {
    if (!port || !port.readable) return;
    keepReading = true;
    reader = port.readable.getReader();

    const decoder = new TextDecoder();
    try {
      while (keepReading) {
        const {value, done} = await reader.read();
        if (done) break;
        if (value) {
          log(decoder.decode(value, {stream:true}));
        }
      }
    } catch (err) {
      log("[READ ERROR] " + err.name + ": " + err.message);
    } finally {
      try { reader.releaseLock(); } catch (_) {}
      reader = null;
    }
  }

  async function connect() {
    if (!('serial' in navigator)) {
      log("[ERROR] Web Serial is not available in this browser.");
      return;
    }

    try {
      const rate = Number(baud.value);
      port = await navigator.serial.requestPort();
      await port.open({
        baudRate: rate,
        dataBits: 8,
        stopBits: 1,
        parity: "none",
        bufferSize: 4096,
        flowControl: "none"
      });

      connectBtn.disabled = true;
      disconnectBtn.disabled = false;
      pingBtn.disabled = false;
      baud.disabled = true;
      setStatus("Connected at " + rate + " baud");
      log("=== CONNECTED @ " + rate + " ===");
      log("Watch the first few lines for ESP32 boot output.");
      log("If readable, press PING to test application traffic.");

      readLoop();

      // Give the ESP32 reset caused by opening the port time to complete.
      await new Promise(r => setTimeout(r, 2000));
      if (port && port.writable) {
        log("> PING");
        writer = port.writable.getWriter();
        await writer.write(new TextEncoder().encode("PING\n"));
        writer.releaseLock();
        writer = null;
      }
    } catch (err) {
      log("[CONNECT ERROR] " + err.name + ": " + err.message);
      await cleanup();
    }
  }

  async function disconnect() {
    await cleanup();
    log("=== DISCONNECTED ===");
  }

  async function cleanup() {
    keepReading = false;
    try { if (reader) await reader.cancel(); } catch (_) {}
    try { if (writer) writer.releaseLock(); } catch (_) {}
    writer = null;
    try { if (port) await port.close(); } catch (_) {}
    port = null;
    reader = null;
    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
    pingBtn.disabled = true;
    baud.disabled = false;
    setStatus("Disconnected");
  }

  async function ping() {
    if (!port || !port.writable) return;
    try {
      writer = port.writable.getWriter();
      await writer.write(new TextEncoder().encode("PING\n"));
      writer.releaseLock();
      writer = null;
      log("> PING");
    } catch (err) {
      log("[WRITE ERROR] " + err.name + ": " + err.message);
      try { if (writer) writer.releaseLock(); } catch (_) {}
      writer = null;
    }
  }

  connectBtn.addEventListener('click', connect);
  disconnectBtn.addEventListener('click', disconnect);
  clearBtn.addEventListener('click', () => { output.textContent = ""; });
  pingBtn.addEventListener('click', ping);
})();
</script>
</body>
</html>
