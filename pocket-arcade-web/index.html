<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>POCKET ARCADE</h1>
<h2>USB GAME INPUT</h2>

<section class="panel">
<button id="connect">CONNECT ESP32</button>
<button id="disconnect" disabled>DISCONNECT</button>
<div id="status">Status: Disconnected</div>
<div id="device">Device: —</div>
</section>

<section class="panel">
<h3>Game Input</h3>
<div class="input-grid">
<button id="menu" disabled>MENU</button>
<button id="back" disabled>BACK</button>
<button id="select" disabled>SELECT</button>
<button id="start" disabled>START</button>
</div>
<p class="hint">Keyboard: Enter = Start · Space = Select · M = Menu · Esc = Back</p>
</section>

<section class="panel readings">
<h3>Joystick</h3>
<div>X: <span id="joyX">—</span></div>
<div>Y: <span id="joyY">—</span></div>
<div>Button: <span id="joyBtn">—</span></div>
<div class="stick-wrap"><div class="stick" id="stick"><div class="stick-dot" id="stickDot"></div></div></div>
<button id="streamOn" disabled>START INPUT STREAM</button>
<button id="streamOff" disabled>STOP INPUT STREAM</button>
</section>

<section class="panel">
<h3>Joystick Calibration</h3>
<p id="calibrationText">The current calibration is stored in the ESP32.</p>
<button id="calibrate" disabled>CALIBRATE JOYSTICK</button>
<div id="calibrationStatus"></div>
</section>

<section class="panel">
<h3>Connection Test</h3>
<button id="ping" disabled>PING</button>
</section>

<section class="panel">
<h3>Console</h3>
<pre id="console"></pre>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
